name: Release Module

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Check version consistency
        env:
          VERSION: ${{ steps.extract_version.outputs.VERSION }}
        run: |
          for f in module.json package.json; do
            v=$(jq -r .version "$f")
            if [ "$v" != "$VERSION" ]; then
              echo "::error file=$f::version is $v but tag is v$VERSION"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate sources
        run: npm run validate

      - name: Build module
        run: npm run build

      - name: Verify build output
        run: |
          test -f historia-dipire/module.json || { echo "::error::module.json missing from build output"; exit 1; }
          for p in adventure actors journal automation; do
            test -n "$(ls -A "historia-dipire/packs/$p")" || { echo "::error::pack $p is empty"; exit 1; }
          done

      - name: Pin download URL to this release
        env:
          VERSION: ${{ steps.extract_version.outputs.VERSION }}
        run: |
          jq --arg v "$VERSION" \
            '.version = $v | .download |= sub("/releases/latest/download/historia-dipire.zip$"; "/releases/download/v\($v)/historia-dipire.zip")' \
            historia-dipire/module.json > historia-dipire/module.json.tmp
          mv historia-dipire/module.json.tmp historia-dipire/module.json
          jq -r '"\(.id) \(.version) \(.download)"' historia-dipire/module.json

      - name: Create ZIP archive
        run: |
          mkdir -p zip-output
          # I file LOG/LOCK sono residui di LevelDB e non servono a Foundry.
          (cd historia-dipire && zip -r -q ../zip-output/historia-dipire.zip . -x 'packs/*/LOG*' 'packs/*/LOCK')
          cp historia-dipire/module.json zip-output/module.json
          ls -lh zip-output

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'zip-output/historia-dipire.zip,zip-output/module.json'
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Release ${{ steps.extract_version.outputs.VERSION }}
          tag: v${{ steps.extract_version.outputs.VERSION }}
          draft: false
          prerelease: false
          generateReleaseNotes: true
          allowUpdates: true
